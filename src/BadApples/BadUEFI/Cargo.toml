[package]
name = "bad-uefi"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
tar-no-std = { version = "0.4.2", features = ["alloc"] }
uefi = { version = "0.39", features = ["alloc", "global_allocator", "panic_handler"] }
xz4rust = { version = "0.2.3", default-features = false, features = ["alloc", "bcj", "crc64", "delta"] }
zune-png = { version = "0.5", default-features = false, features = ["sse"] }

